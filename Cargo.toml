[package]
name = "ding"
version = "0.1.0"
edition = "2024"
default-run = "ding"

[dependencies]
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
poise = "0.6"
dotenvy = "0.15"
thiserror = "2"
